name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**.json", "**.js", "**.ts", "**.jsx", "**.tsx", "**.yml"]
  pull_request:
    branches: [main]
    paths: ["**.json", "**.js", "**.ts", "**.jsx", "**.tsx", "**.yml"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      # No Boost here: the native modules come prebuilt from npm, so the
      # tests never compile anything. Installing libboost-dev was a leftover
      # from deepnest-next, and it failed the whole job whenever Ubuntu's
      # package server couldn't be reached (11 Nov 2026: three runs in an
      # hour, before any test ran).
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          # npm install
          npm ci
      - name: Verify Electron binary
        # The build job installs Electron's binary fine on ubuntu-22.04 + Node
        # 20; lts/* (Node 24) on ubuntu-latest did not — install.js silently
        # no-opped, leaving no path.txt, so _electron.launch() died with
        # "Electron failed to install correctly". The job above is now pinned
        # to that proven environment; this step asserts the binary is really
        # there and self-heals (forced clean re-extract) if it ever isn't.
        run: |
          if ! node -e "require('electron')" >/dev/null 2>&1; then
            echo "Electron binary missing after npm ci — forcing a clean reinstall"
            rm -rf node_modules/electron/dist node_modules/electron/path.txt
            DEBUG='@electron/get*' force_no_cache=true node node_modules/electron/install.js
          fi
          node -e "const p=require('electron'),fs=require('fs');console.log('electron ->',p);if(!fs.existsSync(p)){console.error('binary missing at',p);process.exit(1)}"
      - name: Build
        run: npm run build
      - name: Install Electron's system libraries
        # The specs use _electron.launch() (the electron binary), not
        # Playwright's bundled Chromium — so install only the Linux system
        # libraries Electron needs (install-deps), NOT the 165 MB Chromium
        # browser. That browser download hung ~18 min post-download and timed
        # out the job; nothing here ever launches it.
        #
        # install-deps needs Ubuntu's package server. When that can't be
        # reached (11 Nov 2026: it failed fetching nine font packages, with
        # every library already on the machine), don't fail on that alone:
        # carry on if the Electron binary has every library it links to and
        # xvfb-run is there, and say so in a warning. Five minutes at most,
        # so a server that never answers can't use up the job's time.
        run: |
          if timeout --kill-after=10 300 npx playwright install-deps chromium; then
            exit 0
          fi
          missing=$(ldd node_modules/electron/dist/electron | grep "not found" || true)
          if [ -n "$missing" ] || ! command -v xvfb-run >/dev/null; then
            echo "install-deps failed, and Electron can't run without it:"
            echo "${missing:-xvfb-run is not installed}"
            exit 1
          fi
          echo "::warning::install-deps could not reach the package server; Electron's libraries are all present, so the tests run without the extra fonts it would have added."
      - name: Run Playwright tests
        run: xvfb-run npm test
      # The report is only worth keeping when a test failed, and not for long:
      # artifacts count against the account's Actions storage.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
